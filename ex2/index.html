<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Travel Guide: OSS 기반 추천 시스템</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --primary: #0047a0; --accent: #cd2e3a; --bg: #f8f9fa; }
        body { font-family: 'Malgun Gothic', sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        
        /* 로그인 섹션 */
        #loginSection { display: flex; justify-content: center; align-items: center; height: 100vh; background: #e9ecef; }
        .login-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; border-top: 5px solid var(--primary); }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        /* 메인 시스템 */
        #mainSystem { display: none; }
        header { background: var(--primary); color: white; padding: 1.5rem; text-align: center; border-bottom: 5px solid var(--accent); }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; }
        .config-card, .detail-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* 지도 스타일 */
        #map { height: 300px; border-radius: 10px; margin-top: 15px; border: 1px solid #ddd; z-index: 1; }
        
        .result-item { background: white; padding: 12px; margin-bottom: 8px; border-radius: 10px; border: 1px solid #eee; cursor: pointer; display: flex; align-items: center; transition: 0.2s; }
        .result-item:hover { border-color: var(--primary); background: #f0f7ff; }
        .rank { background: var(--accent); color: white; width: 25px; height: 25px; border-radius: 50%; text-align: center; font-size: 0.8rem; line-height: 25px; margin-right: 10px; flex-shrink: 0; }
        .detail-card img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="loginSection">
    <div class="login-box">
        <h2>🔑 System Login</h2>
        <input type="text" id="userId" placeholder="ID (nbuweb)">
        <input type="password" id="userPw" placeholder="Password (webweb)">
        <button onclick="checkAuth()">Login</button>
        <p id="errMsg" style="color:red; font-size:0.8rem; display:none; margin-top:10px;">인증 정보가 틀립니다.</p>
    </div>
</div>

<div id="mainSystem">
    <header><h1>🇰🇷 K-Travel 가이드 (Leaflet OSS 버전)</h1></header>
    <div class="container">
        <div class="left-panel">
            <div class="config-card">
                <h2>스타일 설정</h2>
                <label>♿ 교통약자</label>
                <select id="accInput"><option value="5">중요</option><option value="3">보통</option><option value="1">상관없음</option></select>
                <label>⏱️ 시간</label>
                <select id="timeInput"><option value="1">짧게</option><option value="3">보통</option><option value="5">길게</option></select>
                <label>💸 예산</label>
                <select id="costInput"><option value="1">알뜰</option><option value="3">보통</option><option value="5">프리미엄</option></select>
                <button onclick="runRecommend()">추천 시작</button>
                <div id="resultArea" style="margin-top:20px; max-height: 300px; overflow-y: auto;"></div>
            </div>
        </div>
        <div class="right-panel">
            <div id="detailCard" class="detail-card" style="display:none;">
                <h2 id="detTitle"></h2>
                <img id="detImg" src="" alt="장소">
                <p id="detDesc" style="color:#666; font-size:0.9rem;"></p>
                <div id="map"></div>
            </div>
        </div>
    </div>
</div>

<script>
let myMap; // 지도를 담을 변수

function checkAuth() {
    if(document.getElementById('userId').value === 'nbuweb' && document.getElementById('userPw').value === 'webweb') {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('mainSystem').style.display = 'block';
        initMap(); // 로그인 성공 시 지도 초기화
    } else { document.getElementById('errMsg').style.display = 'block'; }
}

function initMap() {
    // OpenStreetMap 패키지를 사용하여 지도 초기화 (기본 서울 좌표)
    myMap = L.map('map').setView([37.5665, 126.9780], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(myMap);
}

const locations = [
    { name: "경복궁", accessibility: 4, time: 3, cost: 2, desc: "한국의 미를 느낄 수 있는 궁궐입니다.", img: "Gyeongbokgung.png", lat: 37.5796, lng: 126.9770 },
    { name: "N서울타워", accessibility: 2, time: 3, cost: 4, desc: "남산 정상에서 서울을 내려다봅니다.", img: "N_Seoul_Tower.png", lat: 37.5511, lng: 126.9882 },
    { name: "해운대 해수욕장", accessibility: 5, time: 3, cost: 2, desc: "부산의 대표적인 해수욕장입니다.", img: "Haeundae.png", lat: 35.1587, lng: 129.1604 }
    // ... 나머지 12개 장소도 동일하게 추가
];

function runRecommend() {
    const user = { acc: parseInt(document.getElementById('accInput').value), time: parseInt(document.getElementById('timeInput').value), cost: parseInt(document.getElementById('costInput').value) };
    const recommended = locations.map(loc => {
        let score = Math.abs(user.acc - loc.accessibility) + Math.abs(user.time - loc.time) + Math.abs(user.cost - loc.cost);
        return { ...loc, score };
    }).sort((a, b) => a.score - b.score);

    const area = document.getElementById('resultArea');
    area.innerHTML = "";
    recommended.forEach((loc, i) => {
        const div = document.createElement('div');
        div.className = 'result-item';
        div.innerHTML = `<div class="rank">${i+1}</div><strong>${loc.name}</strong>`;
        div.onclick = () => showDetail(loc);
        area.appendChild(div);
    });
    showDetail(recommended[0]);
}

let marker;
function showDetail(loc) {
    document.getElementById('detailCard').style.display = 'block';
    document.getElementById('detTitle').innerText = loc.name;
    document.getElementById('detDesc').innerText = loc.desc;
    document.getElementById('detImg').src = loc.img;

    // 지도 중심 이동 및 마커 표시
    myMap.setView([loc.lat, loc.lng], 15);
    if (marker) myMap.removeLayer(marker);
    marker = L.marker([loc.lat, loc.lng]).addTo(myMap)
        .bindPopup(loc.name).openPopup();
    
    // 리플릿 지도가 깨지지 않도록 강제 리사이즈 호출
    setTimeout(() => { myMap.invalidateSize(); }, 200);
}
</script>
</body>
</html>

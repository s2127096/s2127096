<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Travel Guide: 최종 데이터 업데이트 버전</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --primary: #0047a0; --accent: #cd2e3a; --bg: #f8f9fa; }
        .busan-theme { --primary: #cd2e3a; --accent: #0047a0; }
        
        body { font-family: 'Malgun Gothic', sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; transition: 0.3s; }
        
        /* --- [복구] 시원한 로그인 화면 --- */
        #loginSection { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background: #dee2e6; 
        }
        .login-box { 
            background: white; padding: 60px 50px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
            width: 100%; max-width: 500px; 
            text-align: center; border-top: 10px solid var(--primary);
        }
        .login-box h2 { font-size: 2.2rem; margin-bottom: 35px; color: var(--primary); }
        .login-box input { 
            width: 100%; padding: 20px; margin: 15px 0; border: 1px solid #ccc; 
            border-radius: 12px; box-sizing: border-box; font-size: 1.2rem;
        }
        .login-btn { 
            width: 100%; padding: 20px; background: var(--primary); color: white; 
            border: none; border-radius: 12px; cursor: pointer; font-weight: bold; 
            font-size: 1.3rem; margin-top: 25px; transition: 0.3s;
        }

        /* --- 메인 UI --- */
        #mainSystem { display: none; }
        header { background: var(--primary); color: white; padding: 2.5rem 1rem; text-align: center; border-bottom: 6px solid var(--accent); transition: 0.3s; }
        
        .city-toggle { display: flex; gap: 15px; justify-content: center; margin: 30px 0; }
        .city-btn { padding: 12px 40px; border-radius: 30px; border: 2px solid var(--primary); background: white; color: var(--primary); cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s; }
        .city-btn.active { background: var(--primary); color: white; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 50px; display: grid; grid-template-columns: 1fr 1.3fr; gap: 30px; }
        .config-card, .detail-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        
        h2 { border-left: 6px solid var(--primary); padding-left: 15px; margin-bottom: 25px; }
        label { display: block; font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; }
        select { width: 100%; padding: 15px; margin-bottom: 25px; border-radius: 10px; border: 1px solid #ddd; font-size: 1.1rem; }
        .action-btn { width: 100%; padding: 18px; background: var(--primary); color: white; cursor: pointer; font-weight: bold; border: none; border-radius: 10px; font-size: 1.2rem; }
        
        .result-list { max-height: 400px; overflow-y: auto; margin-top: 20px; border-top: 2px solid #eee; padding-top: 15px; }
        .result-item { padding: 18px; margin-bottom: 12px; border-radius: 15px; border: 1px solid #eee; cursor: pointer; display: flex; align-items: center; background: #fff; transition: 0.2s; }
        .rank { background: var(--accent); color: white; width: 30px; height: 30px; border-radius: 50%; text-align: center; font-size: 1rem; line-height: 30px; margin-right: 15px; flex-shrink: 0; }

        #map { height: 400px; border-radius: 15px; margin-top: 25px; border: 1px solid #ccc; z-index: 1; }
        .detail-card img { width: 100%; height: auto;max-height: 500px;object-fit: scale-down;border-radius: 15px; margin-bottom: 20px; border: 1px solid #eee; }
        
        @media (max-width: 850px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body id="mainBody">

<div id="loginSection">
    <div class="login-box">
        <h2>🔒 K-Travel Guide</h2>
        <input type="text" id="userId" placeholder="아이디 (nbuweb)">
        <input type="password" id="userPw" placeholder="비밀번호 (webweb)">
        <button class="login-btn" onclick="checkAuth()">시스템 접속</button>
        <p id="errMsg" style="color:red; display:none; margin-top:20px; font-weight:bold;">인증 정보가 틀립니다.</p>
    </div>
</div>

<div id="mainSystem">
    <header>
        <h1 id="headerTitle">🇰🇷 서울 맞춤 여행 가이드</h1>
        <p>새롭게 업데이트된 최신 데이터로 최적의 장소를 추천합니다.</p>
    </header>

    <div class="city-toggle">
        <button id="btnSeoul" class="city-btn active" onclick="switchCity('Seoul')">서울 (SEOUL)</button>
        <button id="btnBusan" class="city-btn" onclick="switchCity('Busan')">부산 (BUSAN)</button>
    </div>

    <div class="container">
        <div class="left-panel">
            <div class="config-card">
                <h2 id="configTitle">서울 스타일 설정</h2>
                <label>♿ 교통약자 편의성</label>
                <select id="accInput">
                    <option value="5">매우 중요</option><option value="4">중요</option><option value="3">보통</option><option value="1">상관없음</option>
                </select>
                <label>⏱️ 희망 소요 시간</label>
                <select id="timeInput">
                    <option value="5">매우 길게</option><option value="4">길게</option><option value="3">보통</option><option value="2">짧게</option><option value="1">매우 짧게</option>
                </select>
                <label>💸 예산 수준</label>
                <select id="costInput">
                    <option value="5">매우 높음</option><option value="4">높음</option><option value="3">보통</option><option value="2">낮음</option><option value="1">가성비</option>
                </select>
                <button class="action-btn" onclick="runRecommend()">맞춤 분석 시작</button>
                <div id="resultArea" class="result-list"></div>
            </div>
        </div>

        <div class="right-panel">
            <div id="detailCard" class="detail-card" style="display:none;">
                <h2 id="detTitle"></h2>
                <img id="detImg" src="" alt="관광지">
                <p id="detDesc" style="line-height:1.8; color:#444; font-size:1.05rem; text-align:left;"></p>
                <div id="map"></div>
            </div>
        </div>
    </div>
</div>

<script>
let myMap, marker;
let currentCity = 'Seoul';

// [데이터 업데이트] 주신 표의 점수를 정확하게 입력 (교통약자, 소요시간, 예산 순)
const locations = [
    // 서울 (10곳)
    { city: 'Seoul', name: "경복궁", accessibility: 4, time: 3, cost: 2, desc: "한국의 정궁으로 넓은 평지가 있어 휠체어 이동도 수월합니다.", img: "Gyeongbokgung.png", lat: 37.5796, lng: 126.9770 },
    { city: 'Seoul', name: "서울타워", accessibility: 1, time: 2, cost: 3, desc: "남산에 위치해 접근성은 낮지만 서울 최고의 야경을 자랑합니다.", img: "N_Seoul_Tower.png", lat: 37.5511, lng: 126.9882 },
    { city: 'Seoul', name: "명동", accessibility: 5, time: 3, cost: 4, desc: "쇼핑의 중심지로 보행 환경이 잘 정비되어 있습니다.", img: "Myeongdong.png", lat: 37.5593, lng: 126.9860 },
    { city: 'Seoul', name: "DDP", accessibility: 2, time: 2, cost: 4, desc: "현대적 건축물로 세련된 전시와 패션을 즐길 수 있습니다.", img: "DDP.png", lat: 37.5668, lng: 127.0094 },
    { city: 'Seoul', name: "북촌한옥마을", accessibility: 5, time: 4, cost: 3, desc: "고즈넉한 한옥의 미를 느낄 수 있는 대표 관광지입니다.", img: "Bukchon.png", lat: 37.5826, lng: 126.9834 },
    { city: 'Seoul', name: "인사동", accessibility: 3, time: 3, cost: 2, desc: "한국 전통 소품과 갤러리가 모여있는 정겨운 거리입니다.", img: "Insadong.png", lat: 37.5744, lng: 126.9854 },
    { city: 'Seoul', name: "이태원", accessibility: 4, time: 4, cost: 3, desc: "글로벌한 분위기와 맛집이 가득한 이국적인 동네입니다.", img: "Itaewon.png", lat: 37.5345, lng: 126.9946 },
    { city: 'Seoul', name: "청계천", accessibility: 3, time: 1, cost: 1, desc: "도심 속 하천을 따라 빠르게 한 바퀴 둘러보기 좋습니다.", img: "Cheonggyecheon.png", lat: 37.5694, lng: 126.9781 },
    { city: 'Seoul', name: "홍대", accessibility: 5, time: 4, cost: 3, desc: "젊은 예술가들과 버스킹 공연이 끊이지 않는 핫플레이스입니다.", img: "Hongdae.png", lat: 37.5567, lng: 126.9236 },
    { city: 'Seoul', name: "한강공원", accessibility: 3, time: 2, cost: 1, desc: "탁 트인 강변에서 여유로운 시간을 보내기 최적입니다.", img: "Hangang_Park.png", lat: 37.5284, lng: 126.9332 },

    // 부산 (10곳)
    { city: 'Busan', name: "감천문화마을", accessibility: 4, time: 4, cost: 2, desc: "계단식 마을로 독특한 풍경을 선사하는 예술 마을입니다.", img: "Gamcheon.png", lat: 35.0975, lng: 129.0106 },
    { city: 'Busan', name: "해동용궁사", accessibility: 4, time: 3, cost: 1, desc: "바닷가에 바로 붙어 있는 장엄한 사찰입니다.", img: "Yonggungsa.png", lat: 35.1885, lng: 129.2232 },
    { city: 'Busan', name: "블루라인파크", accessibility: 2, time: 3, cost: 4, desc: "해안 열차를 타고 부산의 바다를 감상하세요.", img: "Blueline.png", lat: 35.1611, lng: 129.1770 },
    { city: 'Busan', name: "태종대", accessibility: 4, time: 5, cost: 1, desc: "웅장한 절벽과 등대가 어우러진 최고의 산책 코스입니다.", img: "Taejongdae.png", lat: 35.0531, lng: 129.0827 },
    { city: 'Busan', name: "해운대 해수욕장", accessibility: 2, time: 2, cost: 1, desc: "부산 하면 떠오르는 대표적인 랜드마크 해변입니다.", img: "Haeundae.png", lat: 35.1587, lng: 129.1604 },
    { city: 'Busan', name: "광안리 해수욕장", accessibility: 2, time: 2, cost: 1, desc: "광안대교의 야경이 손에 잡힐 듯 가깝게 보입니다.", img: "Gwangalli.png", lat: 35.1531, lng: 129.1189 },
    { city: 'Busan', name: "부산타워", accessibility: 2, time: 2, cost: 2, desc: "용두산 공원에 위치해 부산 시내를 한눈에 내려다봅니다.", img: "Busan_Tower.png", lat: 35.1007, lng: 129.0326 },
    { city: 'Busan', name: "국제시장", accessibility: 3, time: 4, cost: 2, desc: "부산의 역사가 살아 숨 쉬는 활기 넘치는 전통 시장입니다.", img: "Gukje_Market.png", lat: 35.1006, lng: 129.0291 },
    { city: 'Busan', name: "엑스더스카이", accessibility: 5, time: 1, cost: 4, desc: "국내 최고층 빌딩에서 즐기는 압도적인 해변 전망대입니다.", img: "Xthesky.png", lat: 35.1601, lng: 129.1685 },
    { city: 'Busan', name: "씨라이프 아쿠아리움", accessibility: 1, time: 3, cost: 4, desc: "바다 속 세상을 생생하게 체험할 수 있는 테마파크입니다.", img: "Sealife.png", lat: 35.1593, lng: 129.1612 }
];

function checkAuth() {
    if(document.getElementById('userId').value === 'nbuweb' && document.getElementById('userPw').value === 'webweb') {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('mainSystem').style.display = 'block';
        initMap();
    } else { document.getElementById('errMsg').style.display = 'block'; }
}

function initMap() {
    myMap = L.map('map').setView([37.5665, 126.9780], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(myMap);
}

function switchCity(city) {
    currentCity = city;
    const body = document.getElementById('mainBody');
    if (city === 'Seoul') {
        body.classList.remove('busan-theme');
        document.getElementById('headerTitle').innerText = "🇰🇷 서울 맞춤 여행 가이드";
        document.getElementById('configTitle').innerText = "서울 스타일 설정";
        document.getElementById('btnSeoul').classList.add('active');
        document.getElementById('btnBusan').classList.remove('active');
    } else {
        body.classList.add('busan-theme');
        document.getElementById('headerTitle').innerText = "⚓ 부산 맞춤 여행 가이드";
        document.getElementById('configTitle').innerText = "부산 스타일 설정";
        document.getElementById('btnBusan').classList.add('active');
        document.getElementById('btnSeoul').classList.remove('active');
    }
    document.getElementById('resultArea').innerHTML = "";
    document.getElementById('detailCard').style.display = "none";
}

function runRecommend() {
    const user = {
        acc: parseInt(document.getElementById('accInput').value),
        time: parseInt(document.getElementById('timeInput').value),
        cost: parseInt(document.getElementById('costInput').value)
    };

    const filtered = locations.filter(loc => loc.city === currentCity);
    const recommended = filtered.map(loc => {
        let score = Math.abs(user.acc - loc.accessibility) + Math.abs(user.time - loc.time) + Math.abs(user.cost - loc.cost);
        return { ...loc, score };
    }).sort((a, b) => a.score - b.score);

    const area = document.getElementById('resultArea');
    area.innerHTML = "";
    recommended.forEach((loc, i) => {
        const div = document.createElement('div');
        div.className = 'result-item';
        div.innerHTML = `<div class="rank">${i+1}</div><strong>${loc.name}</strong>`;
        div.onclick = () => showDetail(loc);
        area.appendChild(div);
    });
    showDetail(recommended[0]);
}

function showDetail(loc) {
    document.getElementById('detailCard').style.display = 'block';
    document.getElementById('detTitle').innerText = loc.name;
    document.getElementById('detDesc').innerText = loc.desc;
    document.getElementById('detImg').src = loc.img;
    myMap.setView([loc.lat, loc.lng], 15);
    if (marker) myMap.removeLayer(marker);
    marker = L.marker([loc.lat, loc.lng]).addTo(myMap).bindPopup(loc.name).openPopup();
    setTimeout(() => { myMap.invalidateSize(); }, 200);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Travel Guide: 맞춤형 추천 시스템</title>
    <style>
        :root { --primary: #0047a0; --accent: #cd2e3a; --bg: #f8f9fa; }
        body { font-family: 'Malgun Gothic', sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        
        /* [1] 로그인 섹션 스타일 */
        #loginSection { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background: #e9ecef; 
        }
        .login-box { 
            background: white; padding: 40px; border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; 
            text-align: center; border-top: 5px solid var(--primary);
        }
        .login-box input { 
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; 
            border-radius: 8px; box-sizing: border-box; font-size: 1rem;
        }
        .login-box button { 
            width: 100%; padding: 12px; background: var(--primary); color: white; 
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }

        /* [2] 메인 시스템 스타일 (기존 스타일 유지) */
        #mainSystem { display: none; } /* 처음에는 숨겨둠 */
        header { background: var(--primary); color: white; padding: 2rem 1rem; text-align: center; border-bottom: 5px solid var(--accent); }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; }
        .config-card, .detail-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .left-panel { position: sticky; top: 20px; height: fit-content; }
        h2 { border-left: 5px solid var(--primary); padding-left: 10px; font-size: 1.2rem; margin-bottom: 15px; }
        select, .action-btn { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; }
        .action-btn { background: var(--primary); color: white; cursor: pointer; font-weight: bold; border: none; transition: 0.3s; }
        .action-btn:hover { background: #003375; }
        .result-list { max-height: 400px; overflow-y: auto; margin-top: 10px; border-top: 2px solid #eee; }
        .result-item { background: white; padding: 12px; margin-bottom: 8px; border-radius: 10px; border: 1px solid #eee; cursor: pointer; display: flex; align-items: center; }
        .result-item:hover { border-color: var(--primary); background: #f0f7ff; }
        .rank { background: var(--accent); color: white; width: 25px; height: 25px; border-radius: 50%; text-align: center; font-size: 0.8rem; line-height: 25px; margin-right: 10px; flex-shrink: 0; }
        .detail-card { min-height: 600px; display: none; text-align: center; }
        .detail-card img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 10px; margin: 15px 0; border: 1px solid #ddd; }
        .map-box { background: #eee; height: 250px; border-radius: 10px; margin-top: 15px; border: 1px solid #ddd; overflow: hidden; }
        
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } .left-panel { position: static; } }
    </style>
</head>
<body>

<div id="loginSection">
    <div class="login-box">
        <h2 style="border:none;">🔒 System Login</h2>
        <p style="color:#666; font-size:0.85rem; margin-bottom:20px;">시스템 평가를 위해 아이디와 비번을 입력하세요.</p>
        <input type="text" id="userId" placeholder="ID (nbuweb)">
        <input type="password" id="userPw" placeholder="Password (webweb)">
        <button onclick="checkAuth()">Login</button>
        <p id="errMsg" style="color:red; font-size:0.8rem; display:none; margin-top:15px;">아이디 또는 비밀번호가 올바르지 않습니다.</p>
    </div>
</div>

<div id="mainSystem">
    <header>
        <h1>🇰🇷 K-Travel 맞춤형 추천 가이드</h1>
        <p>당신의 조건에 맞춰 최적의 여행지를 분석하고 지도로 보여드립니다.</p>
    </header>

    <div class="container">
        <div class="left-panel">
            <div class="config-card">
                <h2>스타일 설정</h2>
                <label>♿ 교통약자 편의성</label>
                <select id="accInput"><option value="5">매우 중요</option><option value="3">보통</option><option value="1">상관없음</option></select>
                <label>⏱️ 소요 시간</label>
                <select id="timeInput"><option value="1">짧게</option><option value="3">보통</option><option value="5">길게</option></select>
                <label>💸 예산 수준</label>
                <select id="costInput"><option value="1">가성비</option><option value="3">보통</option><option value="5">럭셔리</option></select>
                <button class="action-btn" onclick="runRecommend()">추천 분석 결과 보기</button>
                <div id="resultArea" class="result-list"></div>
            </div>
        </div>

        <div class="right-panel">
            <div id="detailCard" class="detail-card">
                <h2 id="detTitle">장소 이름</h2>
                <img id="detImg" src="" alt="장소 이미지">
                <p id="detDesc" style="line-height:1.6; color:#555; text-align: left; padding: 0 10px;"></p>
                <div id="map" class="map-box"></div>
                <button class="action-btn" id="mapLinkBtn" style="margin-top:20px; background:#4285F4;">Google 지도 크게 보기</button>
            </div>
        </div>
    </div>
</div>

<script>
// [인증 로직]
function checkAuth() {
    const id = document.getElementById('userId').value;
    const pw = document.getElementById('userPw').value;

    if (id === 'nbuweb' && pw === 'webweb') {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('mainSystem').style.display = 'block';
    } else {
        document.getElementById('errMsg').style.display = 'block';
    }
}

// [여행지 데이터]
const locations = [
    { name: "경복궁", accessibility: 4, time: 3, cost: 2, desc: "조선 왕조의 정궁으로 넓은 평지와 아름다운 건축물을 감상할 수 있습니다.", img: "Gyeongbokgung.png", lat: 37.5796, lng: 126.9770 },
    { name: "N서울타워", accessibility: 2, time: 3, cost: 4, desc: "서울의 전경을 한눈에 볼 수 있는 랜드마크입니다. 야경이 특히 유명합니다.", img: "N_Seoul_Tower.png", lat: 37.5511, lng: 126.9882 },
    { name: "명동", accessibility: 5, time: 4, cost: 4, desc: "다양한 브랜드 쇼핑과 길거리 음식을 즐길 수 있는 서울 최고의 번화가입니다.", img: "Myeongdong.png", lat: 37.5593, lng: 126.9860 },
    { name: "이태원", accessibility: 2, time: 3, cost: 4, desc: "글로벌 문화가 공존하며 독특한 맛집과 이국적인 분위기를 즐길 수 있습니다.", img: "Itaewon.png", lat: 37.5345, lng: 126.9946 },
    { name: "DDP", accessibility: 5, time: 3, cost: 2, desc: "우주선을 닮은 독특한 건축물로 전시와 패션쇼가 자주 열리는 디자인 명소입니다.", img: "DDP.png", lat: 37.5668, lng: 127.0094 },
    { name: "북촌 한옥마을", accessibility: 1, time: 3, cost: 1, desc: "한옥의 정취를 느끼며 산책할 수 있는 마을로 사진 촬영지로 인기가 많습니다.", img: "Bukchon.png", lat: 37.5826, lng: 126.9834 },
    { name: "인사동", accessibility: 4, time: 2, cost: 2, desc: "전통 찻집, 공예품점, 갤러리가 모여 있는 한국 전통 문화의 중심지입니다.", img: "Insadong.png", lat: 37.5744, lng: 126.9854 },
    { name: "청계천", accessibility: 3, time: 2, cost: 1, desc: "도심 속 흐르는 하천을 따라 걸으며 여유를 느낄 수 있는 산책로입니다.", img: "Cheonggyecheon.png", lat: 37.5694, lng: 126.9781 },
    { name: "한강 공원", accessibility: 4, time: 4, cost: 1, desc: "탁 트인 강을 보며 자전거를 타거나 피크닉을 즐기기 좋습니다.", img: "Hangang_Park.png", lat: 37.5284, lng: 126.9332 },
    { name: "홍대", accessibility: 4, time: 4, cost: 3, desc: "버스킹 공연과 예술적 감각이 넘치는 젊음의 거리입니다.", img: "Hongdae.png", lat: 37.5567, lng: 126.9236 },
    { name: "해운대 해수욕장", accessibility: 5, time: 3, cost: 2, desc: "부산을 대표하는 해변으로 주변 편의시설과 호텔이 매우 잘 되어 있습니다.", img: "Haeundae.png", lat: 35.1587, lng: 129.1604 },
    { name: "광안리 해수욕장", accessibility: 4, time: 2, cost: 2, desc: "광안대교의 조명을 바라보며 카페거리를 즐길 수 있는 낭만적인 곳입니다.", img: "Gwangalli.png", lat: 35.1531, lng: 129.1189 },
    { name: "자갈치 시장", accessibility: 3, time: 2, cost: 3, desc: "신선한 해산물을 맛볼 수 있는 한국 최대의 수산시장입니다.", img: "Jagalchi_Market.png", lat: 35.0968, lng: 129.0306 },
    { name: "태종대", accessibility: 2, time: 5, cost: 2, desc: "웅장한 해안 절벽과 탁 트인 바다 전망이 일품인 부산의 명승지입니다.", img: "Taejongdae.png", lat: 35.0531, lng: 129.0827 },
    { name: "부산타워", accessibility: 3, time: 2, cost: 3, desc: "용두산 공원에 위치하여 부산항과 원도심의 풍경을 한눈에 감상할 수 있습니다.", img: "Busan_Tower.png", lat: 35.1007, lng: 129.0326 }
];

function runRecommend() {
    const userCondition = {
        accessibility: parseInt(document.getElementById('accInput').value),
        time: parseInt(document.getElementById('timeInput').value),
        cost: parseInt(document.getElementById('costInput').value)
    };

    const recommended = locations.map(loc => {
        let score = Math.abs(userCondition.accessibility - loc.accessibility) +
                    Math.abs(userCondition.time - loc.time) +
                    Math.abs(userCondition.cost - loc.cost);
        return { ...loc, score };
    }).sort((a, b) => a.score - b.score);

    const resultArea = document.getElementById('resultArea');
    resultArea.innerHTML = "";
    
    recommended.forEach((loc, index) => {
        const div = document.createElement('div');
        div.className = 'result-item';
        div.innerHTML = `<div class="rank">${index + 1}</div><div><strong>${loc.name}</strong></div>`;
        div.onclick = () => showDetail(loc);
        resultArea.appendChild(div);
    });
    showDetail(recommended[0]);
}

function showDetail(loc) {
    document.getElementById('detailCard').style.display = 'block';
    document.getElementById('detTitle').innerText = loc.name;
    document.getElementById('detDesc').innerText = loc.desc;
    document.getElementById('detImg').src = loc.img;
    
    const mapUrl = `https://www.google.com/maps/embed/v1/view?key=YOUR_API_KEY&center=${loc.lat},${loc.lng}&zoom=15`; 
    // 실제 API 키가 없다면 아래의 일반 검색 URL 형식을 사용해 지도를 띄울 수 있습니다.
    const embedUrl = `https://maps.google.com/maps?q=${loc.lat},${loc.lng}&hl=ko&z=15&output=embed`;
    
    document.getElementById('map').innerHTML = `<iframe width="100%" height="100%" frameborder="0" src="${embedUrl}"></iframe>`;
    
    document.getElementById('mapLinkBtn').onclick = () => {
        window.open(`https://www.google.com/maps/search/?api=1&query=${loc.lat},${loc.lng}`);
    };
}
</script>
</body>
</html>

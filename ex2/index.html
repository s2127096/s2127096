<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韓国旅行ガイド</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --primary: #0047a0; --accent: #cd2e3a; --bg: #f8f9fa; }
        .busan-theme { --primary: #cd2e3a; --accent: #0047a0; }
        
        body { font-family: 'Meiryo', 'Hiragino Kaku Gothic ProN', sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; transition: 0.3s; }
        
        #loginSection { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background: #dee2e6; 
        }
        .login-box { 
            background: white; padding: 60px 50px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
            width: 100%; max-width: 500px; 
            text-align: center; border-top: 10px solid var(--primary);
        }
        .login-box h2 { font-size: 2.2rem; margin-bottom: 35px; color: var(--primary); }
        .login-box input { 
            width: 100%; padding: 20px; margin: 15px 0; border: 1px solid #ccc; 
            border-radius: 12px; box-sizing: border-box; font-size: 1.2rem;
        }
        .login-btn { 
            width: 100%; padding: 20px; background: var(--primary); color: white; 
            border: none; border-radius: 12px; cursor: pointer; font-weight: bold; 
            font-size: 1.3rem; margin-top: 25px; transition: 0.3s;
        }

        #mainSystem { display: none; }
        header { background: var(--primary); color: white; padding: 2.5rem 1rem; text-align: center; border-bottom: 6px solid var(--accent); transition: 0.3s; }
        
        .city-toggle { display: flex; gap: 15px; justify-content: center; margin: 30px 0; }
        .city-btn { padding: 12px 40px; border-radius: 30px; border: 2px solid var(--primary); background: white; color: var(--primary); cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s; }
        .city-btn.active { background: var(--primary); color: white; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 50px; display: grid; grid-template-columns: 1fr 1.3fr; gap: 30px; }
        .config-card, .detail-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        
        h2 { border-left: 6px solid var(--primary); padding-left: 15px; margin-bottom: 25px; }
        label { display: block; font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; }
        select { width: 100%; padding: 15px; margin-bottom: 25px; border-radius: 10px; border: 1px solid #ddd; font-size: 1.1rem; }
        .action-btn { width: 100%; padding: 18px; background: var(--primary); color: white; cursor: pointer; font-weight: bold; border: none; border-radius: 10px; font-size: 1.2rem; }
        
        .result-list { max-height: 400px; overflow-y: auto; margin-top: 20px; border-top: 2px solid #eee; padding-top: 15px; }
        .result-item { padding: 18px; margin-bottom: 12px; border-radius: 15px; border: 1px solid #eee; cursor: pointer; display: flex; align-items: center; background: #fff; transition: 0.2s; }
        .rank { background: var(--accent); color: white; width: 30px; height: 30px; border-radius: 50%; text-align: center; font-size: 1rem; line-height: 30px; margin-right: 15px; flex-shrink: 0; }

        /* 画像表示設定 */
        #map { height: 400px; border-radius: 15px; margin-top: 25px; border: 1px solid #ccc; z-index: 1; }
        .detail-card img { 
            width: 100%; 
            height: auto; 
            max-width: 300px;
            max-height: 180px; 
            object-fit: contain; 
            background-color: #f8f9fa;
            border-radius: 15px; 
            margin-bottom: 20px; 
            border: 1px solid #eee; 
            display: block;
            margin-left: auto;
            margin-right: auto;
            image-rendering: -webkit-optimize-contrast;
        }

        @media (max-width: 850px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body id="mainBody">

<div id="loginSection">
    <div class="login-box">
        <h2>🔒 K-Travel Guide</h2>
        <input type="text" id="userId" placeholder="ユーザーID">
        <input type="password" id="userPw" placeholder="パスワード">
        <button class="login-btn" onclick="checkAuth()">システムにログイン</button>
        <p id="errMsg" style="color:red; display:none; margin-top:20px; font-weight:bold;">認証情報が正しくありません。</p>
    </div>
</div>

<div id="mainSystem">
    <header>
        <h1 id="headerTitle">日本人向けのソウル旅行ガイド</h1>
        <p>あなたの好みに合わせた最適な場所を提案します。</p>
    </header>

    <div class="city-toggle">
        <button id="btnSeoul" class="city-btn active" onclick="switchCity('Seoul')">ソウル (SEOUL)</button>
        <button id="btnBusan" class="city-btn" onclick="switchCity('Busan')">釜山 (BUSAN)</button>
    </div>

    <div class="container">
        <div class="left-panel">
            <div class="config-card">
                <h2 id="configTitle">ソウルのスタイル設定</h2>
                <label>♿ バリアフリーの重要性</label>
                <select id="accInput">
                    <option value="5">非常に重要</option><option value="4">重要</option><option value="3">普通</option><option value="2">低い</option><option value="1">気にしない</option>
                </select>
                <label>⏱️ 希望滞在時間</label>
                <select id="timeInput">
                    <option value="5">とても長く</option><option value="4">長く</option><option value="3">普通</option><option value="2">短く</option><option value="1">とても短く</option>
                </select>
                <label>💸 予算レベル</label>
                <select id="costInput">
                    <option value="5">非常に高い</option><option value="4">高い</option><option value="3">普通</option><option value="2">低い</option><option value="1">コスパ重視</option>
                </select>
                <button class="action-btn" onclick="runRecommend()">おすすめ分析開始</button>
                <div id="resultArea" class="result-list"></div>
            </div>
        </div>

        <div class="right-panel">
            <div id="detailCard" class="detail-card" style="display:none;">
                <h2 id="detTitle"></h2>
                <img id="detImg" src="" alt="観光地">
                <p id="detDesc" style="line-height:1.8; color:#444; font-size:1.05rem; text-align:left;"></p>
                <div id="map"></div>
            </div>
        </div>
    </div>
</div>

<script>
let myMap, marker;
let currentCity = 'Seoul';

const locations = [
    { city: 'Seoul', name: "景福宮 (キョンボックン)", accessibility: 4, time: 3, cost: 2, desc: "韓国を代表する王宮で、平地が多く車椅子やベビーカーでも移動しやすいです。", img: "Gyeongbokgung.png", lat: 37.5796, lng: 126.9770 },
    { city: 'Seoul', name: "Nソウルタワー", accessibility: 1, time: 2, cost: 3, desc: "南山の頂上に位置するランドマークで、ソウルの夜景を一望できます。", img: "N_Seoul_Tower.png", lat: 37.5511, lng: 126.9882 },
    { city: 'Seoul', name: "明洞 (ミョンドン)", accessibility: 5, time: 3, cost: 4, desc: "ショッピングとストリートフードの聖地で、常に活気にあふれています。", img: "Myeongdong.png", lat: 37.5593, lng: 126.9860 },
    { city: 'Seoul', name: "DDP (東大門デザインプラザ)", accessibility: 2, time: 2, cost: 4, desc: "独創的な建築デザインが特徴で、展示やファッションを楽しめる空間です。", img: "DDP.png", lat: 37.5668, lng: 127.0094 },
    { city: 'Seoul', name: "北村韓屋村", accessibility: 5, time: 4, cost: 3, desc: "伝統的な韓国の家屋「韓屋」が保存されており、情緒ある街並みが楽しめます。", img: "Bukchon.png", lat: 37.5826, lng: 126.9834 },
    { city: 'Seoul', name: "仁寺洞 (インサドン)", accessibility: 3, time: 3, cost: 2, desc: "伝統茶屋やギャラリーが多く、韓国の伝統文化を感じられる通りです。", img: "Insadong.png", lat: 37.5744, lng: 126.9854 },
    { city: 'Seoul', name: "梨泰院 (イテウォン)", accessibility: 4, time: 4, cost: 3, desc: "多様な国の文化や料理が集まる、国際色豊かなエリアです。", img: "Itaewon.png", lat: 37.5345, lng: 126.9946 },
    { city: 'Seoul', name: "清渓川 (チョンゲチョン)", accessibility: 3, time: 1, cost: 1, desc: "都会の中心を流れる川沿いの散策路で、リラックスするのに最適です。", img: "Cheonggyecheon.png", lat: 37.5694, lng: 126.9781 },
    { city: 'Seoul', name: "弘大 (ホンデ)", accessibility: 5, time: 4, cost: 3, desc: "若者の街として知られ、芸術的なエネルギーと活気にあふれています。", img: "Hongdae.png", lat: 37.5567, lng: 126.9236 },
    { city: 'Seoul', name: "漢江公園", accessibility: 3, time: 2, cost: 1, desc: "広い川沿いでピクニックやサイクリングを楽しめる市民の憩いの場です。", img: "Hangang_Park.png", lat: 37.5284, lng: 126.9332 },

    { city: 'Busan', name: "甘川文化村", accessibility: 4, time: 4, cost: 2, desc: "カラフルな家々が並ぶ絶景が特徴で、「韓国のマチュピチュ」と呼ばれています。", img: "Gamcheon.png", lat: 35.0975, lng: 129.0106 },
    { city: 'Busan', name: "海東龍宮寺", accessibility: 4, time: 3, cost: 1, desc: "海沿いに建てられた珍しい寺院で、壮大な景色を楽しむことができます。", img: "Yonggungsa.png", lat: 35.1885, lng: 129.2232 },
    { city: 'Busan', name: "ブルーラインパーク", accessibility: 2, time: 3, cost: 4, desc: "海岸列車に乗って釜山の美しい海をゆったりと鑑賞できます。", img: "Blueline.png", lat: 35.1611, lng: 129.1770 },
    { city: 'Busan', name: "太宗台 (テジョンデ)", accessibility: 4, time: 5, cost: 1, desc: "断崖絶壁と海が織りなす絶景が魅力の、釜山を代表する景勝地です。", img: "Taejongdae.png", lat: 35.0531, lng: 129.0827 },
    { city: 'Busan', name: "海雲台ビーチ", accessibility: 2, time: 2, cost: 1, desc: "韓国で最も有名なビーチで、周辺には高級ホテルや飲食店が並びます。", img: "Haeundae.png", lat: 35.1587, lng: 129.1604 },
    { city: 'Busan', name: "広安里ビーチ", accessibility: 2, time: 2, cost: 1, desc: "広安大橋の夜景が美しく、ロマンチックな雰囲気が漂うビーチです。", img: "Gwangalli.png", lat: 35.1531, lng: 129.1189 },
    { city: 'Busan', name: "釜山タワー", accessibility: 2, time: 2, cost: 2, desc: "龍頭山公園にあり、釜山の港街を一望できる展望タワーです。", img: "Busan_Tower.png", lat: 35.1007, lng: 129.0326 },
    { city: 'Busan', name: "国際市場", accessibility: 3, time: 4, cost: 2, desc: "活気あふれる伝統市場で、食べ歩きやショッピングを楽しめます。", img: "Gukje_Market.png", lat: 35.1006, lng: 129.0291 },
    { city: 'Busan', name: "X the SKY", accessibility: 5, time: 1, cost: 4, desc: "超高層ビルから見下ろす釜山のオーシャンビューは圧巻です。", img: "Xthesky.png", lat: 35.1601, lng: 129.1685 },
    { city: 'Busan', name: "シーライフ釜山", accessibility: 1, time: 3, cost: 4, desc: "多様な海洋生物に出会える、家族連れにも人気の水族館です。", img: "Sealife.png", lat: 35.1593, lng: 129.1612 }
];

function checkAuth() {
    const id = document.getElementById('userId').value;
    const pw = document.getElementById('userPw').value;

    if((id === 'nbuweb' && pw === 'webweb') || (id === 'admin' && pw === 'webadmin')) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('mainSystem').style.display = 'block';
        initMap();
    } else { 
        document.getElementById('errMsg').style.display = 'block'; 
    }
}

function initMap() {
    myMap = L.map('map').setView([37.5665, 126.9780], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(myMap);
}

function switchCity(city) {
    currentCity = city;
    const body = document.getElementById('mainBody');
    if (city === 'Seoul') {
        body.classList.remove('busan-theme');
        document.getElementById('headerTitle').innerText = "日本人向けのソウル旅行ガイド";
        document.getElementById('configTitle').innerText = "ソウルのスタイル設定";
        document.getElementById('btnSeoul').classList.add('active');
        document.getElementById('btnBusan').classList.remove('active');
    } else {
        body.classList.add('busan-theme');
        document.getElementById('headerTitle').innerText = "日本人向けの釜山旅行ガイド";
        document.getElementById('configTitle').innerText = "釜山のスタイル設定";
        document.getElementById('btnBusan').classList.add('active');
        document.getElementById('btnSeoul').classList.remove('active');
    }
    document.getElementById('resultArea').innerHTML = "";
    document.getElementById('detailCard').style.display = "none";
}

function runRecommend() {
    const user = {
        acc: parseInt(document.getElementById('accInput').value),
        time: parseInt(document.getElementById('timeInput').value),
        cost: parseInt(document.getElementById('costInput').value)
    };

    const filtered = locations.filter(loc => loc.city === currentCity);
    const recommended = filtered.map(loc => {
        let score = Math.abs(user.acc - loc.accessibility) + Math.abs(user.time - loc.time) + Math.abs(user.cost - loc.cost);
        return { ...loc, score };
    }).sort((a, b) => a.score - b.score);

    const area = document.getElementById('resultArea');
    area.innerHTML = "";
    recommended.forEach((loc, i) => {
        const div = document.createElement('div');
        div.className = 'result-item';
        div.innerHTML = `<div class="rank">${i+1}</div><strong>${loc.name}</strong>`;
        div.onclick = () => showDetail(loc);
        area.appendChild(div);
    });
    showDetail(recommended[0]);
}

function showDetail(loc) {
    document.getElementById('detailCard').style.display = 'block';
    document.getElementById('detTitle').innerText = loc.name;
    document.getElementById('detDesc').innerText = loc.desc;
    document.getElementById('detImg').src = loc.img;
    myMap.setView([loc.lat, loc.lng], 15);
    if (marker) myMap.removeLayer(marker);
    marker = L.marker([loc.lat, loc.lng]).addTo(myMap).bindPopup(loc.name).openPopup();
    setTimeout(() => { myMap.invalidateSize(); }, 200);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Travel Guide (B2B Solution)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --primary: #0047a0; --accent: #cd2e3a; --bg: #f8f9fa; --admin-color: #28a745; }
        .busan-theme { --primary: #cd2e3a; --accent: #0047a0; }
        
        body { font-family: 'Meiryo', sans-serif; background: var(--bg); margin: 0; color: #333; }
        
        /* ログインセクション */
        #loginSection { display: flex; justify-content: center; align-items: center; height: 100vh; background: #dee2e6; }
        .login-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-box input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .login-btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }

        /* メインシステム */
        #mainSystem { display: none; }
        header { background: var(--primary); color: white; padding: 2rem; text-align: center; border-bottom: 5px solid var(--accent); }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }

        /* 管理者パネルスタイル */
        #adminPanel { border: 2px solid var(--admin-color); display: none; }
        .admin-badge { background: var(--admin-color); color: white; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; margin-bottom: 10px; display: inline-block; }
        .admin-input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }

        #map { height: 400px; border-radius: 10px; margin-top: 15px; }
        .result-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; }
        .result-item:hover { background: #f0f4f8; }
        .rank { background: var(--accent); color: white; width: 25px; height: 25px; border-radius: 50%; text-align: center; margin-right: 15px; font-size: 0.9rem; line-height: 25px; }
        
        .city-btn { padding: 10px 30px; border-radius: 20px; border: 2px solid var(--primary); background: white; color: var(--primary); cursor: pointer; font-weight: bold; margin: 0 5px; }
        .city-btn.active { background: var(--primary); color: white; }
        
        img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body id="mainBody">

<div id="loginSection">
    <div class="login-box">
        <h2>K-Travel Guide Login</h2>
        <input type="text" id="userId" placeholder="ID (nbuweb or admin)">
        <input type="password" id="userPw" placeholder="Password">
        <button class="login-btn" onclick="checkAuth()">ログイン</button>
        <p id="errMsg" style="color:red; display:none; margin-top:15px;">認証情報が正しくありません。</p>
    </div>
</div>

<div id="mainSystem">
    <header>
        <h1 id="headerTitle">韓国旅行B2B提案システム</h1>
        <p>旅行会社向け：日本人顧客への最適観光地提案ツール</p>
    </header>

    <div style="text-align:center; margin: 20px 0;">
        <button id="btnSeoul" class="city-btn active" onclick="switchCity('Seoul')">SEOUL</button>
        <button id="btnBusan" class="city-btn" onclick="switchCity('Busan')">BUSAN</button>
    </div>

    <div class="container">
        <div class="left-panel">
            <div id="adminPanel" class="card">
                <span class="admin-badge">管理者モード(CMS)</span>
                <h3>新しい観光地の登録</h3>
                <input type="text" id="newName" class="admin-input" placeholder="観光地名">
                <textarea id="newDesc" class="admin-input" placeholder="説明文"></textarea>
                <div style="display:flex; gap:5px;">
                    <input type="number" id="newLat" class="admin-input" placeholder="緯度(Lat)" step="0.0001">
                    <input type="number" id="newLng" class="admin-input" placeholder="経度(Lng)" step="0.0001">
                </div>
                <button onclick="addNewLocation()" style="width:100%; padding:10px; background:var(--admin-color); color:white; border:none; border-radius:5px; cursor:pointer;">システムに追加保存</button>
            </div>

            <div class="card">
                <h3>条件設定</h3>
                <label>♿ バリアフリー</label>
                <select id="accInput" class="admin-input"><option value="5">重視</option><option value="3">普通</option><option value="1">気にしない</option></select>
                <label>💸 予算レベル</label>
                <select id="costInput" class="admin-input"><option value="1">コスパ重視</option><option value="3">普通</option><option value="5">ラグジュアリー</option></select>
                <button class="login-btn" onclick="runRecommend()" style="margin-top:10px;">分析実行</button>
                <div id="resultArea" style="margin-top:20px;"></div>
            </div>
        </div>

        <div class="right-panel">
            <div id="detailCard" class="card" style="display:none;">
                <h2 id="detTitle"></h2>
                <img id="detImg" src="" alt="観光地画像">
                <p id="detDesc"></p>
                <div id="map"></div>
            </div>
        </div>
    </div>
</div>

<script>
let myMap, marker, currentCity = 'Seoul';
let locations = [
    { city: 'Seoul', name: "景福宮", accessibility: 4, cost: 2, desc: "伝統的な王宮。平地が多く歩きやすいです。", img: "https://images.unsplash.com/photo-1538669715515-5c375b207996?w=400", lat: 37.5796, lng: 126.9770 },
    { city: 'Busan', name: "甘川文化村", accessibility: 2, cost: 1, desc: "絶景が楽しめるアートの街。階段が多いので注意。", img: "https://images.unsplash.com/photo-1590664216212-62e763768c33?w=400", lat: 35.0975, lng: 129.0106 }
];

// PDF 지침 [4-4] 인증 정보 적용
function checkAuth() {
    const id = document.getElementById('userId').value;
    const pw = document.getElementById('userPw').value;

    if (id === 'admin' && pw === 'webadmin') {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('mainSystem').style.display = 'block';
        document.getElementById('adminPanel').style.display = 'block';
        initMap();
    } else if (id === 'nbuweb' && pw === 'webweb') {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('mainSystem').style.display = 'block';
        document.getElementById('adminPanel').style.display = 'none';
        initMap();
    } else {
        document.getElementById('errMsg').style.display = 'block';
    }
}

function initMap() {
    if (myMap) return;
    myMap = L.map('map').setView([37.5665, 126.9780], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(myMap);
    loadSavedData();
}

function switchCity(city) {
    currentCity = city;
    document.getElementById('btnSeoul').classList.toggle('active', city === 'Seoul');
    document.getElementById('btnBusan').classList.toggle('active', city === 'Busan');
    runRecommend();
}

// 관리자 데이터 추가 기능 (LocalStorage 활용)
function addNewLocation() {
    const name = document.getElementById('newName').value;
    const desc = document.getElementById('newDesc').value;
    const lat = parseFloat(document.getElementById('newLat').value);
    const lng = parseFloat(document.getElementById('newLng').value);

    if (!name || isNaN(lat)) { alert("情報を入力してください"); return; }

    const newLoc = { city: currentCity, name, accessibility: 3, cost: 3, desc, img: "https://images.unsplash.com/photo-1493916665398-143bdeabe500?w=400", lat, lng };
    
    locations.push(newLoc);
    
    // 로컬스토리지에 저장하여 새로고침해도 유지 (PDF CMS 요건 충족)
    const localData = JSON.parse(localStorage.getItem('myTravelData') || "[]");
    localData.push(newLoc);
    localStorage.setItem('myTravelData', JSON.stringify(localData));

    alert("新しい観光地をシステムに登録しました！");
    runRecommend();
}

function loadSavedData() {
    const localData = JSON.parse(localStorage.getItem('myTravelData') || "[]");
    locations = [...locations, ...localData];
}

function runRecommend() {
    const userAcc = parseInt(document.getElementById('accInput').value);
    const userCost = parseInt(document.getElementById('costInput').value);

    const filtered = locations.filter(l => l.city === currentCity);
    const sorted = filtered.sort((a, b) => {
        const scoreA = Math.abs(a.accessibility - userAcc) + Math.abs(a.cost - userCost);
        const scoreB = Math.abs(b.accessibility - userAcc) + Math.abs(b.cost - userCost);
        return scoreA - scoreB;
    });

    const area = document.getElementById('resultArea');
    area.innerHTML = "";
    sorted.forEach((loc, i) => {
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `<div class="rank">${i+1}</div><div><strong>${loc.name}</strong></div>`;
        item.onclick = () => showDetail(loc);
        area.appendChild(item);
    });
    if(sorted.length > 0) showDetail(sorted[0]);
}

function showDetail(loc) {
    document.getElementById('detailCard').style.display = 'block';
    document.getElementById('detTitle').innerText = loc.name;
    document.getElementById('detDesc').innerText = loc.desc;
    document.getElementById('detImg').src = loc.img;
    myMap.setView([loc.lat, loc.lng], 15);
    if (marker) myMap.removeLayer(marker);
    marker = L.marker([loc.lat, loc.lng]).addTo(myMap).bindPopup(loc.name).openPopup();
    setTimeout(() => { myMap.invalidateSize(); }, 200);
}
</script>
</body>
</html>

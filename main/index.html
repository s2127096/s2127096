<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韓国旅行ガイド (B2B Solution)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --primary: #0047a0; --accent: #cd2e3a; --bg: #f8f9fa; --admin-color: #28a745; }
        .busan-theme { --primary: #cd2e3a; --accent: #0047a0; }
        
        body { font-family: 'Meiryo', sans-serif; background: var(--bg); margin: 0; color: #333; }
        
        /* ログイン画面 */
        #loginSection { display: flex; justify-content: center; align-items: center; height: 100vh; background: #dee2e6; }
        .login-box { background: white; padding: 50px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 450px; text-align: center; border-top: 10px solid var(--primary); }
        .login-box h2 { color: var(--primary); margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 1.1rem; }
        .login-btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.2rem; margin-top: 20px; }

        /* メインシステム */
        #mainSystem { display: none; }
        header { background: var(--primary); color: white; padding: 2rem; text-align: center; border-bottom: 5px solid var(--accent); }
        
        .city-toggle { display: flex; gap: 15px; justify-content: center; margin: 30px 0; }
        .city-btn { padding: 12px 40px; border-radius: 30px; border: 2px solid var(--primary); background: white; color: var(--primary); cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        .city-btn.active { background: var(--primary); color: white; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 50px; display: grid; grid-template-columns: 1fr 1.3fr; gap: 30px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); margin-bottom: 25px; }
        
        h2, h3 { color: #333; margin-top: 0; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.95rem; }
        select, .admin-input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; box-sizing: border-box; }
        .action-btn { width: 100%; padding: 15px; background: var(--primary); color: white; cursor: pointer; font-weight: bold; border: none; border-radius: 10px; font-size: 1.1rem; transition: 0.2s; }
        .action-btn:hover { opacity: 0.9; }

        /* 管理者パネル */
        #adminPanel { border: 2px solid var(--admin-color); display: none; }
        .admin-badge { background: var(--admin-color); color: white; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; margin-bottom: 15px; display: inline-block; }
        .score-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .score-group div { flex: 1; }
        .score-group label { font-size: 0.8rem; }

        /* 結果リスト */
        .result-list { max-height: 500px; overflow-y: auto; margin-top: 20px; }
        .result-item { padding: 15px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #eee; background: #fff; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
        .result-item:hover { background: #f1f3f5; }
        .item-info { display: flex; align-items: center; cursor: pointer; flex-grow: 1; }
        .rank { background: var(--accent); color: white; width: 30px; height: 30px; border-radius: 50%; text-align: center; font-size: 1rem; line-height: 30px; margin-right: 15px; flex-shrink: 0; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; margin-left: 10px; }
        .delete-btn:hover { background: #c82333; }

        /* マップと詳細 */
        #map { height: 500px; border-radius: 15px; margin-top: 0; border: 1px solid #ccc; }
        #detTitle { font-size: 1.8rem; border-left: 5px solid var(--primary); padding-left: 15px; margin-bottom: 15px; }
        #detDesc { font-size: 1.1rem; line-height: 1.8; color: #444; margin-bottom: 25px; }
    </style>
</head>
<body id="mainBody">

<div id="loginSection">
    <div class="login-box">
        <h2>🔒 K-Travel Guide</h2>
        <input type="text" id="userId" placeholder="ユーザーID (nbuweb / admin)">
        <input type="password" id="userPw" placeholder="パスワード">
        <button class="login-btn" onclick="checkAuth()">ログイン</button>
        <p id="errMsg" style="color:red; display:none; margin-top:20px; font-weight:bold;">IDまたはパスワードが違います。</p>
    </div>
</div>

<div id="mainSystem">
    <header>
        <h1 id="headerTitle">日本人向けのソウル旅行ガイド</h1>
        <p>顧客のニーズに合わせた最適な観光地を提案するB2Bツール</p>
    </header>

    <div class="city-toggle">
        <button id="btnSeoul" class="city-btn active" onclick="switchCity('Seoul')">ソウル</button>
        <button id="btnBusan" class="city-btn" onclick="switchCity('Busan')">釜山</button>
    </div>

    <div class="container">
        <div class="left-panel">
            
            <div id="adminPanel" class="card">
                <span class="admin-badge">管理者モード (CMS)</span>
                <h3>🛠️ 観光地の追加</h3>
                <label>都市選択</label>
                <select id="newCity" class="admin-input">
                    <option value="Seoul">ソウル (Seoul)</option>
                    <option value="Busan">釜山 (Busan)</option>
                </select>
                
                <input type="text" id="newName" class="admin-input" placeholder="観光地名">
                <textarea id="newDesc" class="admin-input" rows="3" placeholder="説明文を入力してください"></textarea>
                
                <div class="score-group">
                    <div>
                        <label>♿バリア(1-5)</label>
                        <input type="number" id="newAcc" class="admin-input" min="1" max="5" value="3">
                    </div>
                    <div>
                        <label>⏱️時間(1-5)</label>
                        <input type="number" id="newTime" class="admin-input" min="1" max="5" value="3">
                    </div>
                    <div>
                        <label>💸予算(1-5)</label>
                        <input type="number" id="newCost" class="admin-input" min="1" max="5" value="3">
                    </div>
                </div>
                
                <div style="display:flex; gap:10px;">
                    <input type="number" id="newLat" class="admin-input" placeholder="緯度 (Lat)" step="0.0001">
                    <input type="number" id="newLng" class="admin-input" placeholder="経度 (Lng)" step="0.0001">
                </div>
                
                <button class="action-btn" onclick="addNewLocation()" style="background:var(--admin-color);">DBに追加保存</button>
            </div>

            <div class="card">
                <h2>スタイル設定</h2>
                
                <label>♿ バリアフリー重要度</label>
                <select id="accInput">
                    <option value="5">5 (非常に重要)</option>
                    <option value="4">4 (重要)</option>
                    <option value="3" selected>3 (普通)</option>
                    <option value="2">2 (あまり気にしない)</option>
                    <option value="1">1 (気にしない)</option>
                </select>
                
                <label>⏱️ 希望滞在時間</label>
                <select id="timeInput">
                    <option value="5">5 (たっぷり)</option>
                    <option value="4">4 (長め)</option>
                    <option value="3" selected>3 (普通)</option>
                    <option value="2">2 (短め)</option>
                    <option value="1">1 (サクッと)</option>
                </select>
                
                <label>💸 予算レベル</label>
                <select id="costInput">
                    <option value="5">5 (ラグジュアリー)</option>
                    <option value="4">4 (高め)</option>
                    <option value="3" selected>3 (普通)</option>
                    <option value="2">2 (安め)</option>
                    <option value="1">1 (コスパ重視)</option>
                </select>
                
                <button class="action-btn" onclick="runRecommend()">おすすめ分析開始</button>
                <div id="resultArea" class="result-list"></div>
            </div>
        </div>

        <div class="right-panel">
            <div id="detailCard" class="card" style="display:none;">
                <h2 id="detTitle"></h2>
                <p id="detDesc"></p>
                <div id="map"></div>
            </div>
        </div>
    </div>
</div>

<script>
let myMap, marker, isAdmin = false, currentCity = 'Seoul';

// 20ヶ所の全データ (日本語)
let locations = [
    // SEOUL (10ヶ所)
    { id: 1, city: 'Seoul', name: "景福宮", accessibility: 4, time: 3, cost: 2, desc: "韓国を代表する王宮で、平地が多く車椅子やベビーカーでも移動しやすいです。", lat: 37.5796, lng: 126.9770 },
    { id: 2, city: 'Seoul', name: "Nソウルタワー", accessibility: 1, time: 2, cost: 3, desc: "南山の頂上に位置するランドマークで、ソウルの夜景を一望できます。", lat: 37.5511, lng: 126.9882 },
    { id: 3, city: 'Seoul', name: "明洞", accessibility: 5, time: 3, cost: 4, desc: "ショッピングとストリートフードの聖地で、常に活気にあふれています。", lat: 37.5593, lng: 126.9860 },
    { id: 4, city: 'Seoul', name: "DDP (東大門)", accessibility: 2, time: 2, cost: 4, desc: "独創的な建築デザインが特徴で、展示やファッションを楽しめる空間です。", lat: 37.5668, lng: 127.0094 },
    { id: 5, city: 'Seoul', name: "北村韓屋村", accessibility: 5, time: 4, cost: 3, desc: "伝統的な韓国の家屋「韓屋」が保存されており、情緒ある街並みが楽しめます。", lat: 37.5826, lng: 126.9834 },
    { id: 6, city: 'Seoul', name: "仁寺洞", accessibility: 3, time: 3, cost: 2, desc: "伝統茶屋やギャラリーが多く、韓国の伝統文化を感じられる通りです。", lat: 37.5744, lng: 126.9854 },
    { id: 7, city: 'Seoul', name: "梨泰院", accessibility: 4, time: 4, cost: 3, desc: "多様な国の文化や料理が集まる、国際色豊かなエリアです。", lat: 37.5345, lng: 126.9946 },
    { id: 8, city: 'Seoul', name: "清渓川", accessibility: 3, time: 1, cost: 1, desc: "都会の中心を流れる川沿いの散策路で、リラックスするのに最適です。", lat: 37.5694, lng: 126.9781 },
    { id: 9, city: 'Seoul', name: "弘大", accessibility: 5, time: 4, cost: 3, desc: "若者の街として知られ、芸術的なエネルギーと活気にあふれています。", lat: 37.5567, lng: 126.9236 },
    { id: 10, city: 'Seoul', name: "漢江公園", accessibility: 3, time: 2, cost: 1, desc: "広い川沿いでピクニックやサイクリングを楽しめる市民の憩いの場です。", lat: 37.5284, lng: 126.9332 },

    // BUSAN (10ヶ所)
    { id: 11, city: 'Busan', name: "甘川文化村", accessibility: 4, time: 4, cost: 2, desc: "カラフルな家々が並ぶ絶景が特徴で、「韓国のマチュピチュ」と呼ばれています。", lat: 35.0975, lng: 129.0106 },
    { id: 12, city: 'Busan', name: "海東龍宮寺", accessibility: 4, time: 3, cost: 1, desc: "海沿いに建てられた珍しい寺院で、壮大な景色を楽しむことができます。", lat: 35.1885, lng: 129.2232 },
    { id: 13, city: 'Busan', name: "ブルーラインパーク", accessibility: 2, time: 3, cost: 4, desc: "海岸列車に乗って釜山の美しい海をゆったりと鑑賞できます。", lat: 35.1611, lng: 129.1770 },
    { id: 14, city: 'Busan', name: "太宗台", accessibility: 4, time: 5, cost: 1, desc: "断崖絶壁と海が織りなす絶景が魅力の、釜山を代表する景勝地です。", lat: 35.0531, lng: 129.0827 },
    { id: 15, city: 'Busan', name: "海雲台ビーチ", accessibility: 2, time: 2, cost: 1, desc: "韓国で最も有名なビーチで、周辺には高級ホテルや飲食店が並びます。", lat: 35.1587, lng: 129.1604 },
    { id: 16, city: 'Busan', name: "広安里ビーチ", accessibility: 2, time: 2, cost: 1, desc: "広安大橋の夜景が美しく、ロマンチックな雰囲気が漂うビーチです。", lat: 35.1531, lng: 129.1189 },
    { id: 17, city: 'Busan', name: "釜山タワー", accessibility: 2, time: 2, cost: 2, desc: "龍頭山公園にあり、釜山の港街を一望できる展望タワーです。", lat: 35.1007, lng: 129.0326 },
    { id: 18, city: 'Busan', name: "国際市場", accessibility: 3, time: 4, cost: 2, desc: "活気あふれる伝統市場で、食べ歩きやショッピングを楽しめます。", lat: 35.1006, lng: 129.0291 },
    { id: 19, city: 'Busan', name: "X the SKY", accessibility: 5, time: 1, cost: 4, desc: "超高層ビルから見下ろす釜山のオーシャンビューは圧巻です。", lat: 35.1601, lng: 129.1685 },
    { id: 20, city: 'Busan', name: "シーライフ釜山", accessibility: 1, time: 3, cost: 4, desc: "多様な海洋生物に出会える、家族連れにも人気の水族館です。", lat: 35.1593, lng: 129.1612 }
];

window.onload = function() {
    // ローカルストレージデータの読み込み (日本語版キー使用)
    const saved = localStorage.getItem('myTravelData_JP_Final');
    if (saved) {
        locations = JSON.parse(saved);
    } else {
        localStorage.setItem('myTravelData_JP_Final', JSON.stringify(locations));
    }
};

function checkAuth() {
    const id = document.getElementById('userId').value;
    const pw = document.getElementById('userPw').value;
    if (id === 'admin' && pw === 'webadmin') {
        isAdmin = true;
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('mainSystem').style.display = 'block';
        document.getElementById('adminPanel').style.display = 'block';
        initMap();
        alert("管理者モードでログインしました。");
    } else if (id === 'nbuweb' && pw === 'webweb') {
        isAdmin = false;
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('mainSystem').style.display = 'block';
        initMap();
    } else { document.getElementById('errMsg').style.display = 'block'; }
}

function initMap() {
    if (myMap) return;
    myMap = L.map('map').setView([37.5665, 126.9780], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(myMap);
}

function switchCity(city) {
    currentCity = city;
    document.getElementById('headerTitle').innerText = city === 'Seoul' ? "日本人向けのソウル旅行ガイド" : "日本人向けの釜山旅行ガイド";
    document.getElementById('btnSeoul').classList.toggle('active', city === 'Seoul');
    document.getElementById('btnBusan').classList.toggle('active', city === 'Busan');
    document.getElementById('mainBody').classList.toggle('busan-theme', city === 'Busan');
    runRecommend();
}

function addNewLocation() {
    const name = document.getElementById('newName').value;
    if(!name) return alert("観光地名を入力してください");
    
    const newLoc = {
        id: Date.now(),
        city: document.getElementById('newCity').value,
        name: name,
        accessibility: parseInt(document.getElementById('newAcc').value),
        time: parseInt(document.getElementById('newTime').value),
        cost: parseInt(document.getElementById('newCost').value),
        desc: document.getElementById('newDesc').value,
        lat: parseFloat(document.getElementById('newLat').value) || 37.56,
        lng: parseFloat(document.getElementById('newLng').value) || 126.97
    };
    locations.push(newLoc);
    localStorage.setItem('myTravelData_JP_Final', JSON.stringify(locations));
    alert("追加しました！");
    
    // 入力欄クリア
    document.getElementById('newName').value = "";
    document.getElementById('newDesc').value = "";
    
    runRecommend();
}

function deleteLocation(id) {
    if(confirm("本当に削除しますか？")) {
        locations = locations.filter(l => l.id !== id);
        localStorage.setItem('myTravelData_JP_Final', JSON.stringify(locations));
        runRecommend();
    }
}

function runRecommend() {
    const userAcc = parseInt(document.getElementById('accInput').value);
    const userTime = parseInt(document.getElementById('timeInput').value);
    const userCost = parseInt(document.getElementById('costInput').value);

    const filtered = locations.filter(l => l.city === currentCity);
    const sorted = filtered.map(l => {
        let score = Math.abs(l.accessibility - userAcc) + Math.abs(l.time - userTime) + Math.abs(l.cost - userCost);
        return {...l, score};
    }).sort((a, b) => a.score - b.score);

    const area = document.getElementById('resultArea');
    area.innerHTML = "";
    
    if (sorted.length === 0) {
        area.innerHTML = "<p style='padding:10px; color:#888;'>該当する観光地がありません。</p>";
        return;
    }

    sorted.forEach((l, i) => {
        const div = document.createElement('div');
        div.className = 'result-item';
        let delBtn = isAdmin ? `<button class="delete-btn" onclick="deleteLocation(${l.id}); event.stopPropagation();">削除</button>` : '';
        div.innerHTML = `<div class="item-info" onclick="showDetail(${l.id})"><div class="rank">${i+1}</div><strong>${l.name}</strong></div>${delBtn}`;
        area.appendChild(div);
    });
    
    // 最初の項目を自動表示
    if(sorted.length > 0) showDetail(sorted[0].id);
}

function showDetail(id) {
    const l = locations.find(loc => loc.id === id);
    if(!l) return;
    document.getElementById('detailCard').style.display = 'block';
    document.getElementById('detTitle').innerText = l.name;
    document.getElementById('detDesc').innerText = l.desc;
    
    myMap.setView([l.lat, l.lng], 14);
    if(marker) myMap.removeLayer(marker);
    marker = L.marker([l.lat, l.lng]).addTo(myMap).bindPopup(l.name).openPopup();
    setTimeout(() => myMap.invalidateSize(), 200);
}
</script>
</body>
</html>

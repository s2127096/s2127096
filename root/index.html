<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Travel: 맞춤형 한국 여행 추천</title>
    <style>
        :root { --primary: #0047a0; --accent: #cd2e3a; --bg: #f8f9fa; }
        body { font-family: 'Malgun Gothic', sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        header { background: var(--primary); color: white; padding: 2rem 1rem; text-align: center; border-bottom: 5px solid var(--accent); }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .config-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { border-left: 5px solid var(--primary); padding-left: 10px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        select { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        button:hover { background: #003375; }
        .result-item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        .rank { background: var(--accent); color: white; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; }
        .info { flex-grow: 1; margin-left: 15px; }
        .match-badge { background: #e7f3ff; color: #2196F3; padding: 4px 8px; border-radius: 5px; font-size: 0.85rem; }
    </style>
</head>
<body>

<header>
    <h1>🇰🇷 K-Travel 가이드</h1>
    <p>당신의 조건에 딱 맞는 한국 여행지를 알고리즘으로 찾아드립니다.</p>
</header>

<div class="container">
    <div class="config-card">
        <h2>내 여행 스타일 설정</h2>
        
        <label>♿ 교통약자 편의성 (배리어 프리)</label>
        <select id="accInput">
            <option value="5">매우 중요 (휠체어/유모차 이용)</option>
            <option value="3">보통</option>
            <option value="1">중요하지 않음</option>
        </select>
        
        <label>💸 여행 비용 (예산)</label>
        <select id="costInput">
            <option value="1">알뜰 여행 (무료/공원)</option>
            <option value="3">적당한 지출</option>
            <option value="5">럭셔리 (호텔/프라이빗)</option>
        </select>

        <button onclick="runRecommend()">추천 여행지 보기</button>
    </div>

    <div id="resultArea"></div>
</div>

<script>
// 여행지 데이터베이스 (수정 가능)
const locations = [
  { name: "경복궁", accessibility: 5, cost: 2, time: 1 },
  { name: "남산 서울타워", accessibility: 4, cost: 3, time: 2 },
  { name: "한강 시민공원", accessibility: 4, cost: 1, time: 1 },
  { name: "제주도 성산일출봉", accessibility: 2, cost: 4, time: 5 },
  { name: "부산 해운대", accessibility: 5, cost: 3, time: 4 }
];

function runRecommend() {
    const userCondition = {
        accessibility: parseInt(document.getElementById('accInput').value),
        cost: parseInt(document.getElementById('costInput').value),
        time: 1 // 기본값
    };

    // 사용자님의 알고리즘 적용
    const recommended = locations.map(location => {
        let score = Math.abs(userCondition.accessibility - location.accessibility) +
                    Math.abs(userCondition.cost - location.cost) +
                    Math.abs(userCondition.time - location.time);
        return { ...location, score };
    }).sort((a, b) => a.score - b.score);

    const resultArea = document.getElementById('resultArea');
    resultArea.innerHTML = "<h2>나를 위한 추천 리스트</h2>";
    
    recommended.forEach((loc, index) => {
        resultArea.innerHTML += `
            <div class="result-item">
                <div class="rank">${index + 1}</div>
                <div class="info">
                    <strong>${loc.name}</strong>
                </div>
                <div class="match-badge">매칭 점수: ${loc.score}</div>
            </div>
        `;
    });
}
</script>

</body>
</html>
